<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gerador do dashboard protegido (USO LOCAL)</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#1F222A;color:#fff;font:15px system-ui,sans-serif}
.box{background:#292D30;border-top:4px solid #248FBB;border-radius:16px;padding:26px;width:min(94vw,460px)}
h2{margin:0 0 6px;color:#79B5D4}p{color:#9fb3bf;margin:0 0 14px;font-size:13px}
input{width:100%;padding:11px 13px;border-radius:10px;border:1px solid #18769D;background:#1F222A;color:#fff;font:inherit;margin-bottom:10px}
button{width:100%;padding:12px;border:0;border-radius:10px;background:#248FBB;color:#fff;font:600 15px inherit;cursor:pointer}
#m{margin-top:12px;font-size:13px;min-height:18px}.w{background:#4a3d18;color:#ffc857;padding:10px;border-radius:8px;font-size:12px;margin-top:14px}
</style></head><body><div class="box">

<input type="password" id="p1" placeholder="Senha"><input type="password" id="p2" placeholder="Repita a senha">
<button id="g">Gerar index.html</button><div id="m"></div>
<div class="w">⚠ Este arquivo (gerar-protegido.html) contém o dashboard SEM criptografia. Use só no seu computador e <b>NÃO suba no GitHub</b>. Suba apenas o index.html gerado + logo.png.</div>
</div>
<script>
const IT=600000,DASH="<!DOCTYPE html>\n<html lang=\"pt-BR\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>OpenBox • Dashboard<\/title>\n<link rel=\"icon\" href=\"logo.png\">\n<script src=\"https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js\"><\/script>\n<style>\n:root{--b1:#18769D;--b2:#248FBB;--b3:#48A5D5;--b4:#79B5D4;--bg:#1F222A;--card:#292D30;--txt:#fff;--mut:#9fb3bf;--bad:#ff6b6b;--ok:#4cd8a0;--warn:#ffc857}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--txt);font:14px/1.4 system-ui,-apple-system,\"Segoe UI\",Roboto,sans-serif}\nheader{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:14px 22px;background:var(--card);border-bottom:3px solid var(--b2);position:sticky;top:0;z-index:5}\nheader img{height:46px}\n.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}\n.ctl button,.ctl input{background:var(--bg);color:var(--txt);border:1px solid var(--b1);border-radius:8px;padding:7px 12px;font:inherit;cursor:pointer}\n.ctl button.on,.ctl button:hover{background:var(--b2);border-color:var(--b2)}\n.ctl input{color-scheme:dark}\n#st{color:var(--mut);font-size:12px}\nmain{padding:20px 22px;max-width:1500px;margin:auto}\n.err{background:#3a2326;border:1px solid var(--bad);padding:12px 16px;border-radius:10px;margin-bottom:16px;display:none}\n.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}\n.kpi{background:var(--card);border-radius:14px;padding:14px 16px;border-top:3px solid var(--b3)}\n.kpi.big{border-top-color:var(--b2);grid-column:span 2}\n.kpi small{color:var(--mut);display:block}\n.kpi b{font-size:24px;display:block;margin-top:4px}\n.kpi.big b{font-size:34px}\n.kpi i{font-style:normal;font-size:12px;color:var(--mut)}\n.neg{color:var(--bad)}.pos{color:var(--ok)}\n.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:14px;margin-bottom:14px}\n.card{background:var(--card);border-radius:14px;padding:16px;min-width:0}\n.card h3{margin:0 0 10px;font-size:15px;color:var(--b4);font-weight:600}\n.cv{position:relative;height:260px}\n.sc{overflow:auto;max-height:460px}\ntable{width:100%;border-collapse:collapse;white-space:nowrap}\nth{position:sticky;top:0;background:var(--card);color:var(--b4);text-align:right;padding:7px 8px;border-bottom:2px solid var(--b1);cursor:pointer;font-weight:600}\ntd{padding:6px 8px;text-align:right;border-bottom:1px solid #353a3e}\nth:first-child,td:first-child{text-align:left}\ntbody tr:hover{background:#31363a}\ntfoot td{font-weight:700;border-top:2px solid var(--b1)}\n.tag{padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600}\n.t-ok{background:#1d4a3b;color:var(--ok)}.t-w{background:#4a3d18;color:var(--warn)}.t-bad{background:#4a2326;color:var(--bad)}.t-n{background:#34393d;color:var(--mut)}\n.alerts{display:flex;flex-wrap:wrap;gap:8px}\n@media(max-width:600px){.grid{grid-template-columns:1fr}.kpi.big{grid-column:span 1}header img{height:36px}}\n<\/style>\n<\/head>\n<body>\n<header>\n  <img src=\"logo.png\" alt=\"OpenBox\">\n  <div class=\"ctl\">\n    <button data-p=\"7\">7 dias<\/button><button data-p=\"30\">30 dias<\/button><button data-p=\"0\" class=\"on\">Tudo<\/button>\n    <input type=\"date\" id=\"d1\"><input type=\"date\" id=\"d2\">\n    <button id=\"rf\">↻ Atualizar<\/button><button onclick=\"sessionStorage.removeItem('ob_k');localStorage.removeItem('ob_k');location.reload()\">Sair<\/button>\n    <span id=\"st\">carregando…<\/span>\n  <\/div>\n<\/header>\n<main>\n  <div class=\"err\" id=\"err\"><\/div>\n  <section class=\"kpis\" id=\"kpis\"><\/section>\n  <section class=\"grid\">\n    <div class=\"card\"><h3>Faturamento por dia<\/h3><div class=\"cv\"><canvas id=\"c1\"><\/canvas><\/div><\/div>\n    <div class=\"card\"><h3>Fluxo de caixa acumulado (entradas − compras)<\/h3><div class=\"cv\"><canvas id=\"c2\"><\/canvas><\/div><\/div>\n  <\/section>\n  <section class=\"grid\">\n    <div class=\"card\"><h3>Top produtos por lucro bruto<\/h3><div class=\"cv\"><canvas id=\"c3\"><\/canvas><\/div><\/div>\n    <div class=\"card\"><h3>Formas de pagamento<\/h3><div class=\"cv\"><canvas id=\"c4\"><\/canvas><\/div><\/div>\n  <\/section>\n  <section class=\"card\" style=\"margin-bottom:14px\"><h3>Alertas de estoque<\/h3><div class=\"alerts\" id=\"al\"><\/div><\/section>\n  <section class=\"card\" style=\"margin-bottom:14px\"><h3>Produtos: markup, lucro e giro (período selecionado)<\/h3><div class=\"sc\" id=\"tp\"><\/div><\/section>\n  <section class=\"card\"><h3>Estoque (posição atual = compras − vendas)<\/h3><div class=\"sc\" id=\"te\"><\/div><\/section>\n<\/main>\n<script>\n/* ====== CONFIGURAÇÃO ====== */\nconst CFG={\n  SHEET_ID:'13O7xpRLQbM-OAw4zSw6sj3uDDwzqRPlU-FCsjjLFQOc',\n  ABAS:{vendas:'Vendas',compras:'Compras'},   // nomes exatos das abas\n  REFRESH_MIN:5,                                // atualização automática\n  JANELA_GIRO:14,                               // dias usados p/ calcular giro\n  ALERTA_DIAS:3                                 // cobertura abaixo disso = \"Repor\"\n};\n/* ====== UTILITÁRIOS ====== */\nconst $=s=>document.querySelector(s);\nconst N=s=>String(s||'').normalize('NFD').replace(/[\\u0300-\\u036f]/g,'').toLowerCase().trim();\nconst brl=n=>(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});\nconst f1=n=>(n||0).toLocaleString('pt-BR',{maximumFractionDigits:1});\nconst pc=n=>isFinite(n)?(n*100).toLocaleString('pt-BR',{maximumFractionDigits:1})+'%':'—';\nconst num=v=>{let s=String(v==null?'':v).replace(/[R$\\s]/g,'');if(!s)return NaN;if(s.includes(','))s=s.replace(/\\./g,'').replace(',','.');return parseFloat(s)};\nconst dt=s=>{s=String(s||'').trim();let m=s.match(/^(\\d{1,2})\\/(\\d{1,2})\\/(\\d{4})/);if(m)return new Date(+m[3],m[2]-1,+m[1]);m=s.match(/^(\\d{4})-(\\d{2})-(\\d{2})/);return m?new Date(+m[1],m[2]-1,+m[3]):null};\nconst iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');\nconst br=d=>d.toLocaleDateString('pt-BR');\nconst sum=(a,f)=>a.reduce((s,x)=>s+f(x),0);\nconst pick=(o,ks)=>{for(const k of ks)if(o[k]!==undefined&&o[k]!=='')return o[k];return''};\nfunction csv(t){const r=[];let row=[],c='',q=false;for(let i=0;i<t.length;i++){const h=t[i];if(q){if(h=='\"'){if(t[i+1]=='\"'){c+='\"';i++}else q=false}else c+=h}else if(h=='\"')q=true;else if(h==','){row.push(c);c=''}else if(h=='\\n'||h=='\\r'){if(h=='\\r'&&t[i+1]=='\\n')i++;row.push(c);r.push(row);row=[];c=''}else c+=h}if(c||row.length){row.push(c);r.push(row)}return r}\nasync function aba(nome){\n  const u=`https://docs.google.com/spreadsheets/d/${CFG.SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(nome)}`;\n  const r=await fetch(u);if(!r.ok)throw new Error('Aba \"'+nome+'\" não encontrada ou sem acesso');\n  const m=csv(await r.text());if(!m.length)return{H:[],R:[]};\n  const H=m[0].map(N);\n  return{H,R:m.slice(1).map(x=>{const o={};H.forEach((h,i)=>o[h]=(x[i]||'').trim());return o})};\n}\nconst tx=o=>{const q=num(pick(o,['quantidade','qtd','qtde','quant']));let v=num(pick(o,['valor','valor total','total','custo total']));\n  const u=num(pick(o,['preco unitario','custo unitario','valor unitario','preco','custo']));if(isNaN(v)&&!isNaN(u))v=u*q;\n  return{d:dt(pick(o,['data','data compra','data da compra'])),i:pick(o,['item','produto','descricao','insumo']),q,v,t:N(pick(o,['tipo','pagamento','forma de pagamento','forma']))}};\nconst ok=x=>x.d&&x.i&&x.q>0&&!isNaN(x.v);\n/* ====== ESTADO ====== */\nlet D={V:[],C:[]},P={a:null,b:null},ch={},sort={};\n/* ====== CÁLCULOS ====== */\nfunction calc(){\n  const inR=x=>(!P.a||x.d>=P.a)&&(!P.b||x.d<=P.b);\n  const V=D.V.filter(inR),C=D.C.filter(inR);\n  const entrou=sum(V,x=>x.v),saiu=sum(C,x=>x.v),din=sum(V.filter(x=>x.t.startsWith('dinheiro')),x=>x.v);\n  const M={};const g=k=>M[k]||(M[k]={item:k,cq:0,cv:0,sq:0,sv:0,pq:0,pv:0,rq:0});\n  D.C.forEach(x=>{const m=g(x.i);m.cq+=x.q;m.cv+=x.v});\n  D.V.forEach(x=>{const m=g(x.i);m.sq+=x.q;m.sv+=x.v});\n  V.forEach(x=>{const m=g(x.i);m.pq+=x.q;m.pv+=x.v});\n  const hoje=new Date();hoje.setHours(0,0,0,0);const j0=new Date(hoje-CFG.JANELA_GIRO*864e5);\n  D.V.filter(x=>x.d>=j0).forEach(x=>g(x.i).rq+=x.q);\n  const L=Object.values(M).map(m=>{\n    m.cm=m.cq?m.cv/m.cq:NaN;m.preco=m.pq?m.pv/m.pq:NaN;m.mk=m.preco-m.cm;m.mkp=m.mk/m.cm;\n    m.lucro=m.pq?m.pv-m.pq*(isNaN(m.cm)?0:m.cm):0;\n    m.est=m.cq-m.sq;m.ct=m.est*(isNaN(m.cm)?0:m.est>0?m.cm:0);\n    m.pvArr=m.sq?m.sv/m.sq:m.preco;m.pot=m.est>0&&m.pvArr?m.est*m.pvArr:0;\n    m.giro=m.rq/CFG.JANELA_GIRO;m.cob=m.giro>0?m.est/m.giro:NaN;\n    m.stat=m.est<=0?'Zerado':m.giro===0?'Sem giro':m.cob<CFG.ALERTA_DIAS?'Repor':m.cob<7?'Atenção':'OK';\n    return m});\n  return{V,C,entrou,saiu,din,L,lucro:sum(L,m=>m.lucro),cmv:sum(L,m=>m.pq*(isNaN(m.cm)?0:m.cm)),\n    estCusto:sum(L,m=>m.ct),estPot:sum(L,m=>m.pot)};\n}\n/* ====== RENDER ====== */\nfunction kpi(l,v,s,c,big){return`<div class=\"kpi${big?' big':''}\"><small>${l}<\/small><b class=\"${c||''}\">${v}<\/b><i>${s||''}<\/i><\/div>`}\nfunction table(id,cols,rows,foot){\n  const s=sort[id]||(sort[id]={k:cols[0].k,d:cols[0].s||1});\n  const cmp=(a,b)=>{let x=a[s.k],y=b[s.k];const nx=typeof x!=='number'||isNaN(x),ny=typeof y!=='number'||isNaN(y);\n    if(nx&&ny)return String(x||'').localeCompare(String(y||''))*s.d;if(nx)return 1;if(ny)return-1;return(x-y)*s.d};\n  const R=[...rows].sort(cmp);\n  return`<table><thead><tr>${cols.map(c=>`<th onclick=\"srt('${id}','${c.k}')\">${c.l}${s.k==c.k?(s.d>0?' ▲':' ▼'):''}<\/th>`).join('')}<\/tr><\/thead><tbody>${\n    R.map(r=>`<tr>${cols.map(c=>`<td>${c.f?c.f(r[c.k],r):r[c.k]}<\/td>`).join('')}<\/tr>`).join('')}<\/tbody>${foot?`<tfoot><tr>${foot}<\/tr><\/tfoot>`:''}<\/table>`}\nwindow.srt=(id,k)=>{const s=sort[id];s.d=s.k==k?-s.d:-1;s.k=k;draw()};\nconst tagC={OK:'t-ok',Atenção:'t-w',Repor:'t-bad',Zerado:'t-bad','Sem giro':'t-n'};\nconst mk=(v,r)=>isNaN(v)?'—':`<span class=\"${v<0?'neg':''}\">${typeof v==='number'?brl(v):v}<\/span>`;\nfunction chart(id,cfg){if(ch[id])ch[id].destroy();ch[id]=new Chart($('#'+id),cfg)}\nfunction draw(){\n  const R=calc();\n  const caixa=R.entrou-R.saiu,dias=new Set(R.V.map(x=>iso(x.d))).size;\n  $('#kpis').innerHTML=\n    kpi('Em caixa',brl(caixa),'entrou − saiu no período',caixa<0?'neg':'pos',1)+\n    kpi('Entrou',brl(R.entrou),R.V.length+' lançamentos de venda')+\n    kpi('Saiu (compras)',brl(R.saiu),R.C.length+' compras')+\n    kpi('Em dinheiro',brl(R.din),'vendas em espécie')+\n    kpi('Lucro bruto',brl(R.lucro),'receita − custo dos produtos',R.lucro<0?'neg':'pos')+\n    kpi('Margem bruta',pc(R.lucro/R.entrou),'sobre o faturamento')+\n    kpi('Ticket médio',brl(R.entrou/(R.V.length||1)),'por lançamento')+\n    kpi('Média por dia',brl(R.entrou/(dias||1)),dias+' dias com venda')+\n    kpi('Recuperado do investimento',pc(R.entrou/(R.saiu||NaN)),'entrou ÷ saiu',R.entrou>=R.saiu?'pos':'')+\n    kpi('Estoque a custo',brl(R.estCusto),'capital parado')+\n    kpi('Estoque a preço de venda',brl(R.estPot),'receita potencial')+\n    kpi('Lucro potencial do estoque',brl(R.estPot-R.estCusto),'se vender tudo','pos');\n  /* gráficos */\n  const days={};R.V.forEach(x=>days[iso(x.d)]=(days[iso(x.d)]||0)+x.v);\n  const ks=Object.keys(days).sort(),lab=ks.map(k=>br(new Date(k+'T00:00')).slice(0,5));\n  const ax={ticks:{color:'#9fb3bf'},grid:{color:'#353a3e'}},opt={responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#fff'}}},scales:{x:ax,y:ax}};\n  chart('c1',{type:'bar',data:{labels:lab,datasets:[{label:'Faturamento',data:ks.map(k=>days[k]),backgroundColor:'#248FBB',borderRadius:6}]},options:{...opt,plugins:{legend:{display:false}}}});\n  const fl={};R.V.forEach(x=>fl[iso(x.d)]=(fl[iso(x.d)]||0)+x.v);R.C.forEach(x=>fl[iso(x.d)]=(fl[iso(x.d)]||0)-x.v);\n  const fk=Object.keys(fl).sort();let ac=0;\n  chart('c2',{type:'line',data:{labels:fk.map(k=>br(new Date(k+'T00:00')).slice(0,5)),datasets:[{label:'Caixa acumulado',data:fk.map(k=>ac+=fl[k]),borderColor:'#48A5D5',backgroundColor:'rgba(72,165,213,.18)',fill:true,tension:.25}]},options:{...opt,plugins:{legend:{display:false}}}});\n  const top=R.L.filter(m=>m.pq).sort((a,b)=>b.lucro-a.lucro).slice(0,8);\n  chart('c3',{type:'bar',data:{labels:top.map(m=>m.item),datasets:[{label:'Lucro bruto',data:top.map(m=>+m.lucro.toFixed(2)),backgroundColor:'#79B5D4',borderRadius:6}]},options:{...opt,indexAxis:'y',plugins:{legend:{display:false}}}});\n  const pg={};R.V.forEach(x=>{const k=x.t?x.t.toUpperCase():'N/I';pg[k]=(pg[k]||0)+x.v});\n  chart('c4',{type:'doughnut',data:{labels:Object.keys(pg),datasets:[{data:Object.values(pg),backgroundColor:['#18769D','#248FBB','#48A5D5','#79B5D4','#9fb3bf'],borderColor:'#292D30'}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'right',labels:{color:'#fff'}}}}});\n  /* alertas */\n  const al=R.L.filter(m=>['Repor','Zerado','Atenção'].includes(m.stat)&&m.cq);\n  const neg=R.L.filter(m=>m.pq&&m.mk<=0);\n  $('#al').innerHTML=(al.map(m=>`<span class=\"tag ${tagC[m.stat]}\">${m.item}: ${m.stat==='Zerado'?'zerado':f1(m.est)+' un · ~'+f1(m.cob)+' dias'}<\/span>`).join('')+\n    neg.map(m=>`<span class=\"tag t-bad\">${m.item}: vendendo abaixo do custo<\/span>`).join(''))||'<span class=\"tag t-ok\">Tudo certo por aqui ✔<\/span>';\n  /* tabelas */\n  const pr=R.L.filter(m=>m.cq||m.sq);\n  const tq=sum(pr,m=>m.pq),tv=sum(pr,m=>m.pv);\n  $('#tp').innerHTML=table('tp',[\n    {k:'item',l:'Item',s:1},{k:'cm',l:'Custo',f:mk},{k:'preco',l:'Preço',f:mk},{k:'mk',l:'Markup',f:mk},\n    {k:'mkp',l:'% Markup',f:(v)=>isNaN(v)?'—':`<span class=\"${v<0?'neg':''}\">${pc(v)}<\/span>`},\n    {k:'pq',l:'Vendidos',f:v=>f1(v)},{k:'pv',l:'Receita',f:mk},{k:'lucro',l:'Lucro',f:(v,r)=>r.pq?mk(v):'—'}],\n    pr,`<td>Total<\/td><td><\/td><td><\/td><td><\/td><td>${pc(R.lucro/(R.cmv||NaN))}<\/td><td>${f1(tq)}<\/td><td>${brl(tv)}<\/td><td>${brl(R.lucro)}<\/td>`);\n  $('#te').innerHTML=table('te',[\n    {k:'item',l:'Item',s:1},{k:'est',l:'Em estoque',f:v=>f1(v)},{k:'cm',l:'CM',f:mk},{k:'ct',l:'Custo total',f:mk},\n    {k:'pot',l:'Valor de venda',f:mk},{k:'sq',l:'Vendidos (total)',f:v=>f1(v)},{k:'giro',l:'Giro/dia',f:v=>f1(v)},\n    {k:'cob',l:'Cobertura (dias)',f:v=>isNaN(v)?'—':f1(v)},{k:'stat',l:'Status',f:v=>`<span class=\"tag ${tagC[v]}\">${v}<\/span>`}],\n    R.L.filter(m=>m.cq),`<td>Total<\/td><td>${f1(sum(R.L,m=>Math.max(m.est,0)))}<\/td><td><\/td><td>${brl(R.estCusto)}<\/td><td>${brl(R.estPot)}<\/td><td>${f1(sum(R.L,m=>m.sq))}<\/td><td><\/td><td><\/td><td><\/td>`);\n}\n/* ====== CARGA ====== */\nasync function load(){\n  $('#st').textContent='atualizando…';const e=$('#err');e.style.display='none';\n  try{\n    const [v,c]=await Promise.all([aba(CFG.ABAS.vendas),aba(CFG.ABAS.compras)]);\n    D.V=v.R.map(tx).filter(ok);D.C=c.R.map(tx).filter(ok);\n    const aviso=[];\n    if(!D.V.length)aviso.push('Nenhuma venda lida. Colunas encontradas em \"'+CFG.ABAS.vendas+'\": '+v.H.join(', '));\n    if(!D.C.length)aviso.push('Nenhuma compra lida. Colunas encontradas em \"'+CFG.ABAS.compras+'\": '+c.H.join(', ')+'. O dashboard espera: Data, Item, Quantidade, Valor (total pago).');\n    if(aviso.length){e.innerHTML=aviso.join('<br>');e.style.display='block'}\n    draw();$('#st').textContent='atualizado às '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});\n  }catch(x){e.innerHTML='Não consegui ler a planilha: '+x.message+'.<br>Confira se ela está compartilhada como \"Qualquer pessoa com o link\" e se os nomes das abas em CFG.ABAS estão corretos.';e.style.display='block';$('#st').textContent='erro'}\n}\ndocument.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{\n  document.querySelectorAll('[data-p]').forEach(x=>x.classList.remove('on'));b.classList.add('on');\n  const n=+b.dataset.p;$('#d1').value=$('#d2').value='';P.b=null;\n  if(n){const d=new Date();d.setHours(0,0,0,0);P.a=new Date(d-(n-1)*864e5)}else P.a=null;draw(
