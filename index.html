const $=s=>document.querySelector(s),b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const enc=u=>btoa(String.fromCharCode(...u));
let fails=0;
async function derive(pw,salt){const m=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:IT,hash:'SHA-256'},m,{name:'AES-GCM',length:256},true,['decrypt'])}
async function abrir(k,lembrar){const d=b64(BLOB);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:d.slice(16,28)},k,d.slice(28)); /* falha aqui se a senha estiver errada */
  if(lembrar!==undefined){try{const raw=enc(new Uint8Array(await crypto.subtle.exportKey('raw',k)));
    sessionStorage.setItem('ob_k',raw);if(lembrar)localStorage.setItem('ob_k',JSON.stringify({k:raw,exp:Date.now()+30*864e5}))}catch(_){}}
  const h=new TextDecoder().decode(pt);document.open();document.write(h);document.close()}
function chave(){try{let s=sessionStorage.getItem('ob_k');
    if(!s){const l=JSON.parse(localStorage.getItem('ob_k')||'null');if(l&&l.exp>Date.now())s=l.k;else localStorage.removeItem('ob_k')}return s}catch(e){return null}}
async function auto(s){try{await abrir(await crypto.subtle.importKey('raw',b64(s),'AES-GCM',true,['decrypt']))}
  catch(e){sessionStorage.removeItem('ob_k');localStorage.removeItem('ob_k');$('#f').style.visibility='visible'}}
$('#f').onsubmit=async e=>{e.preventDefault();const bt=$('#bt'),m=$('#m');bt.disabled=true;m.textContent='';
  try{const k=await derive($('#pw').value,b64(BLOB).slice(0,16));await abrir(k,$('#lm').checked)}
  catch(x){
    if(x&&x.name==='OperationError'){fails++;let w=Math.min(2**fails,30);m.textContent='Senha incorreta.';
      const t=setInterval(()=>{bt.textContent='Aguarde '+w+'s';if(--w<0){clearInterval(t);bt.textContent='Entrar';bt.disabled=false}},1000);return}
    m.textContent='Erro: '+x}
  bt.disabled=false};
const K=chave();if(K){$("#f").style.visibility="hidden";const go=()=>setTimeout(()=>auto(K),0);document.readyState==="complete"?go():addEventListener("load",go)}
})();
